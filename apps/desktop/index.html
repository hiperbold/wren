<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wren</title>
    <!--
      First-paint loading: paints the theme's dark background and a CSS-only
      spinner right in the static HTML, before the React bundle loads. This way
      there's no white flash. When React mounts into `#root`, it replaces the
      children and the spinner disappears on its own — no JS needed. Theme
      palette: background #171513, text #f4ece4, accent #e07a3f / #ffb266.
    -->
    <style>
      html,
      body {
        background: #171513;
        margin: 0;
      }
      /* Wrapper that centers the spinner across the whole window. */
      .wren-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #171513;
      }
      /* Subtle ring spinning in the accent over an almost-invisible track. */
      .wren-boot__spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(244, 236, 228, 0.12);
        border-top-color: #e07a3f;
        border-right-color: #ffb266;
        animation: wren-spin 0.8s linear infinite;
      }
      @keyframes wren-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Boot spinner; replaced by React on mount. -->
      <div class="wren-boot" role="status" aria-label="Loading">
        <div class="wren-boot__spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
