[workspace]
resolver = "2"
members = [
    "crates/wren-core",
    "crates/wren-adapters",
    "crates/wren-embedded",
    "crates/wren-bench",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rafaelvieiras/wren"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
# A small binary matters for a lightweight desktop app.
strip = true
lto = true
codegen-units = 1
panic = "abort"
