name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [windows-build]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop

      - name: Build Tauri app (NSIS installer)
        shell: pwsh
        working-directory: apps/desktop
        run: |
          # The NSIS tooling download from GitHub occasionally times out on the
          # runner; a retry reuses the finished cargo build and only redoes the
          # bundling step, so it is cheap.
          $attempts = 0
          do {
            npx tauri build --bundles nsis
            $code = $LASTEXITCODE
            $attempts++
          } while ($code -ne 0 -and $attempts -lt 3)
          exit $code

      - name: List bundle output
        shell: pwsh
        run: Get-ChildItem -Recurse target/release/bundle | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: wren-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/wren-desktop.exe
          if-no-files-found: error
